<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ thống Quản lý Nhân sự & CSKH</title>
    <!-- Tailwind CSS cho giao diện hiện đại -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-100 font-sans antialiased">

    <!-- MÀN HÌNH ĐĂNG NHẬP -->
    <div id="login-screen" class="min-h-screen flex items-center justify-center bg-gradient-to-br from-blue-600 to-indigo-800 p-4">
        <div class="bg-white rounded-xl shadow-2xl max-w-md w-full p-8">
            <div class="text-center mb-8">
                <i class="fa-solid fa-users-gear text-5xl text-blue-600 mb-3"></i>
                <h1 class="text-2xl font-bold text-gray-800">Hệ Thống Nội Bộ</h1>
                <p class="text-sm text-gray-500">Quản lý nhân sự, chấm công & CSKH</p>
            </div>
            
            <form id="login-form" onsubmit="handleLogin(event)" class="space-y-5">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Chọn vai trò</label>
                    <select id="login-role" onchange="toggleRoleFields()" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
                        <option value="staff">Nhân viên</option>
                        <option value="admin">Quản trị viên (Admin)</option>
                    </select>
                </div>

                <div id="staff-select-container">
                    <label class="block text-sm font-medium text-gray-700 mb-1">Chọn nhân viên</label>
                    <select id="login-staff-id" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
                        <!-- Render dynamic -->
                    </select>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Mật khẩu</label>
                    <input type="password" id="login-password" required placeholder="Nhập mật khẩu..." class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
                    <p class="text-xs text-gray-400 mt-1">Mặc định Admin: admin123 | Nhân viên: 123</p>
                </div>

                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2.5 rounded-lg transition duration-200">
                    Đăng Nhập
                </button>
            </form>
        </div>
    </div>

    <!-- MÀN HÌNH CHÍNH (DASHBOARD) -->
    <div id="app-screen" class="hidden min-h-screen flex flex-col">
        <!-- Header -->
        <header class="bg-white shadow-sm border-b px-6 py-4 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <i class="fa-solid fa-building-shield text-2xl text-blue-600"></i>
                <span id="app-title" class="text-xl font-bold text-gray-800">Cổng Thông Tin Nhân Sự</span>
            </div>
            <div class="flex items-center space-x-4">
                <span id="user-welcome" class="text-sm font-medium text-gray-600">Xin chào, ...</span>
                <button onclick="handleLogout()" class="bg-red-50 text-red-600 hover:bg-red-100 px-3 py-1.5 rounded-lg text-sm font-medium transition">
                    <i class="fa-solid fa-right-from-bracket mr-1"></i> Đăng xuất
                </button>
            </div>
        </header>

        <!-- Body Layout -->
        <div class="flex flex-1 overflow-hidden">
            <!-- Sidebar -->
            <aside class="w-64 bg-white border-r flex flex-col">
                <nav id="sidebar-nav" class="p-4 space-y-1">
                    <!-- Dynamic Navigation -->
                </nav>
            </aside>

            <!-- Main Content Container -->
            <main id="main-content" class="flex-1 overflow-y-auto p-6 bg-gray-50">
                <!-- Nội dung thay đổi tùy theo menu -->
            </main>
        </div>
    </div>

    <!-- JavaScript Xử Lý Toàn Bộ Ứng Dụng -->
    <script>
        // --- 1. DỮ LIỆU BAN ĐẦU & LOCALSTORAGE ---
        const DEFAULT_DATA = {
            staffs: [
                { id: 'NV01', name: 'Nguyễn Văn Hải', role: 'Nhân sự', pass: '123', phone: '0901111222' },
                { id: 'NV02', name: 'Trần Thị Mai', role: 'CSKH', pass: '123', phone: '0903333444' },
                { id: 'NV03', name: 'Lê Hoàng Nam', role: 'Kỹ thuật', pass: '123', phone: '0905555666' }
            ],
            admins: [
                { username: 'admin', pass: 'admin123', name: 'Quản Trị Viên Hệ Thống' }
            ],
            attendance: [], // { staffId, date, checkIn, checkOut, status }
            shifts: [
                { id: 1, name: 'Ca Sáng (08:00 - 12:00)', staffId: 'NV01', date: '2026-07-27' },
                { id: 2, name: 'Ca Chiều (13:00 - 17:00)', staffId: 'NV02', date: '2026-07-27' }
            ],
            tickets: [
                { id: 1, staffId: 'NV01', title: 'Thắc mắc lương tháng trước', content: 'Tôi chưa nhận được phụ cấp chuyên cần.', status: 'Đang xử lý', reply: '' }
            ]
        };

        function initDatabase() {
            if (!localStorage.getItem('ems_data')) {
                localStorage.setItem('ems_data', JSON.stringify(DEFAULT_DATA));
            }
        }

        function getDB() {
            return JSON.parse(localStorage.getItem('ems_data'));
        }

        function saveDB(data) {
            localStorage.setItem('ems_data', JSON.stringify(data));
        }

        let currentUser = null; // Lưu thông tin người dùng đang đăng nhập

        // --- 2. XỬ LÝ ĐĂNG NHẬP & PHÂN QUYỀN ---
        window.onload = function() {
            initDatabase();
            renderStaffDropdown();
        };

        function renderStaffDropdown() {
            const db = getDB();
            const select = document.getElementById('login-staff-id');
            select.innerHTML = db.staffs.map(s => `<option value="${s.id}">${s.name} (${s.role})</option>`).join('');
        }

        function toggleRoleFields() {
            const role = document.getElementById('login-role').value;
            const container = document.getElementById('staff-select-container');
            container.style.display = (role === 'admin') ? 'none' : 'block';
        }

        function handleLogin(e) {
            e.preventDefault();
            const role = document.getElementById('login-role').value;
            const pass = document.getElementById('login-password').value;
            const db = getDB();

            if (role === 'admin') {
                const admin = db.admins.find(a => a.pass === pass);
                if (admin) {
                    currentUser = { type: 'admin', ...admin };
                    startApp();
                } else {
                    alert('Mật khẩu quản trị viên không chính xác!');
                }
            } else {
                const staffId = document.getElementById('login-staff-id').value;
                const staff = db.staffs.find(s => s.id === staffId);
                if (staff && staff.pass === pass) {
                    currentUser = { type: 'staff', ...staff };
                    startApp();
                } else {
                    alert('Mật khẩu nhân viên không chính xác!');
                }
            }
        }

        function handleLogout() {
            currentUser = null;
            document.getElementById('login-screen').classList.remove('hidden');
            document.getElementById('app-screen').classList.add('hidden');
            document.getElementById('login-password').value = '';
        }

        function startApp() {
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('app-screen').classList.remove('hidden');
            document.getElementById('user-welcome').innerText = `Xin chào, ${currentUser.name} (${currentUser.type === 'admin' ? 'Admin' : currentUser.role})`;
            
            renderSidebar();
            loadDefaultTab();
        }

        // --- 3. ĐIỀU HƯỚNG GIAO DIỆN (SIDEBAR) ---
        function renderSidebar() {
            const nav = document.getElementById('sidebar-nav');
            if (currentUser.type === 'admin') {
                nav.innerHTML = `
                    <button onclick="switchTab('admin-staff')" class="w-full flex items-center space-x-3 px-4 py-2.5 rounded-lg text-gray-700 hover:bg-blue-50 hover:text-blue-600 font-medium transition"><i class="fa-solid fa-users w-5"></i><span>Quản lý Nhân sự</span></button>
                    <button onclick="switchTab('admin-shifts')" class="w-full flex items-center space-x-3 px-4 py-2.5 rounded-lg text-gray-700 hover:bg-blue-50 hover:text-blue-600 font-medium transition"><i class="fa-solid fa-calendar-days w-5"></i><span>Phân Công Ca Trực</span></button>
                    <button onclick="switchTab('admin-attendance')" class="w-full flex items-center space-x-3 px-4 py-2.5 rounded-lg text-gray-700 hover:bg-blue-50 hover:text-blue-600 font-medium transition"><i class="fa-solid fa-clock-rotate-left w-5"></i><span>Bảng Chấm Công</span></button>
                    <button onclick="switchTab('admin-payroll')" class="w-full flex items-center space-x-3 px-4 py-2.5 rounded-lg text-gray-700 hover:bg-blue-50 hover:text-blue-600 font-medium transition"><i class="fa-solid fa-file-invoice-dollar w-5"></i><span>Tính Lương</span></button>
                    <button onclick="switchTab('admin-cskh')" class="w-full flex items-center space-x-3 px-4 py-2.5 rounded-lg text-gray-700 hover:bg-blue-50 hover:text-blue-600 font-medium transition"><i class="fa-solid fa-headset w-5"></i><span>Hỗ Trợ CSKH</span></button>
                `;
            } else {
                nav.innerHTML = `
                    <button onclick="switchTab('staff-dashboard')" class="w-full flex items-center space-x-3 px-4 py-2.5 rounded-lg text-gray-700 hover:bg-blue-50 hover:text-blue-600 font-medium transition"><i class="fa-solid fa-house w-5"></i><span>Trang Chủ</span></button>
                    <button onclick="switchTab('staff-attendance')" class="w-full flex items-center space-x-3 px-4 py-2.5 rounded-lg text-gray-700 hover:bg-blue-50 hover:text-blue-600 font-medium transition"><i class="fa-solid fa-fingerprint w-5"></i><span>Chấm Công Của Tôi</span></button>
                    <button onclick="switchTab('staff-shifts')" class="w-full flex items-center space-x-3 px-4 py-2.5 rounded-lg text-gray-700 hover:bg-blue-50 hover:text-blue-600 font-medium transition"><i class="fa-solid fa-calendar-check w-5"></i><span>Lịch Trực Ca</span></button>
                    <button onclick="switchTab('staff-cskh')" class="w-full flex items-center space-x-3 px-4 py-2.5 rounded-lg text-gray-700 hover:bg-blue-50 hover:text-blue-600 font-medium transition"><i class="fa-solid fa-circle-question w-5"></i><span>Gửi Yêu Cầu / CSKH</span></button>
                `;
            }
        }

        function loadDefaultTab() {
            if (currentUser.type === 'admin') {
                switchTab('admin-staff');
            } else {
                switchTab('staff-dashboard');
            }
        }

        function switchTab(tabId) {
            const main = document.getElementById('main-content');
            const db = getDB();
            
            // Xóa active cũ, highlight menu hiện tại (nếu cần)
            
            if (tabId === 'admin-staff') {
                main.innerHTML = `
                    <div class="flex justify-between items-center mb-6">
                        <h2 class="text-xl font-bold text-gray-800">Danh Sách Nhân Sự</h2>
                        <button onclick="openAddStaffModal()" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg text-sm font-medium transition"><i class="fa-solid fa-user-plus mr-1"></i> Thêm Nhân Viên</button>
                    </div>
                    <div class="bg-white rounded-xl shadow overflow-hidden">
                        <table class="w-full text-left border-collapse">
                            <thead>
                                <tr class="bg-gray-50 border-b text-gray-600 text-sm">
                                    <th class="p-4">Mã NV</th>
                                    <th class="p-4">Họ Tên</th>
                                    <th class="p-4">Bộ Phận</th>
                                    <th class="p-4">Số Điện Thoại</th>
                                    <th class="p-4">Mật khẩu</th>
                                    <th class="p-4 text-center">Hành Động</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y text-sm">
                                ${db.staffs.map(s => `
                                    <tr>
                                        <td class="p-4 font-semibold text-blue-600">${s.id}</td>
                                        <td class="p-4">${s.name}</td>
                                        <td class="p-4"><span class="bg-blue-50 text-blue-700 px-2.5 py-1 rounded-full text-xs font-semibold">${s.role}</span></td>
                                        <td class="p-4">${s.phone}</td>
                                        <td class="p-4"><input type="password" value="${s.pass}" readonly class="bg-gray-100 border px-2 py-1 rounded w-24 text-xs"></td>
                                        <td class="p-4 text-center space-x-2">
                                            <button onclick="deleteStaff('${s.id}')" class="text-red-500 hover:text-red-700"><i class="fa-solid fa-trash"></i></button>
                                        </td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    </div>
                `;
            } else if (tabId === 'admin-shifts') {
                main.innerHTML = `
                    <div class="flex justify-between items-center mb-6">
                        <h2 class="text-xl font-bold text-gray-800">Quản Lý Phân Công Ca Trực</h2>
                        <button onclick="openAddShiftModal()" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg text-sm font-medium transition"><i class="fa-solid fa-plus mr-1"></i> Phân Ca Mới</button>
                    </div>
                    <div class="bg-white rounded-xl shadow overflow-hidden">
                        <table class="w-full text-left border-collapse">
                            <thead>
                                <tr class="bg-gray-50 border-b text-gray-600 text-sm">
                                    <th class="p-4">Ngày Trực</th>
                                    <th class="p-4">Tên Ca</th>
                                    <th class="p-4">Nhân Viên Phụ Trách</th>
                                    <th class="p-4 text-center">Hành Động</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y text-sm">
                                ${db.shifts.map(sh => {
                                    const staff = db.staffs.find(s => s.id === sh.staffId);
                                    return `
                                        <tr>
                                            <td class="p-4">${sh.date}</td>
                                            <td class="p-4 font-medium">${sh.name}</td>
                                            <td class="p-4">${staff ? staff.name : 'Không rõ'} (${sh.staffId})</td>
                                            <td class="p-4 text-center">
                                                <button onclick="deleteShift(${sh.id})" class="text-red-500 hover:text-red-700"><i class="fa-solid fa-trash"></i></button>
                                            </td>
                                        </tr>
                                    `;
                                }).join('')}
                            </tbody>
                        </table>
                    </div>
                `;
            } else if (tabId === 'admin-attendance') {
                main.innerHTML = `
                    <h2 class="text-xl font-bold text-gray-800 mb-6">Bảng Chấm Công Toàn Bộ Nhân Viên</h2>
                    <div class="bg-white rounded-xl shadow overflow-hidden">
                        <table class="w-full text-left border-collapse">
                            <thead>
                                <tr class="bg-gray-50 border-b text-gray-600 text-sm">
                                    <th class="p-4">Mã NV</th>
                                    <th class="p-4">Ngày</th>
                                    <th class="p-4">Giờ Vào (Check-in)</th>
                                    <th class="p-4">Giờ Ra (Check-out)</th>
                                    <th class="p-4">Trạng Thái</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y text-sm">
                                ${db.attendance.length === ? `<tr><td colspan="5" class="p-6 text-center text-gray-400">Chưa có dữ liệu chấm công nào.</td></tr>` : 
                                db.attendance.map(at => `
                                    <tr>
                                        <td class="p-4 font-semibold">${at.staffId}</td>
                                        <td class="p-4">${at.date}</td>
                                        <td class="p-4 text-green-600 font-medium">${at.checkIn || '---'}</td>
                                        <td class="p-4 text-red-600 font-medium">${at.checkOut || '---'}</td>
                                        <td class="p-4"><span class="bg-green-50 text-green-700 px-2 py-1 rounded text-xs font-semibold">Đã ghi nhận</span></td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    </div>
                `;
            } else if (tabId === 'admin-payroll') {
                main.innerHTML = `
                    <h2 class="text-xl font-bold text-gray-800 mb-6">Bảng Lương Tổng Hợp Nhân Sự</h2>
                    <div class="bg-white rounded-xl shadow overflow-hidden">
                        <table class="w-full text-left border-collapse">
                            <thead>
                                <tr class="bg-gray-50 border-b text-gray-600 text-sm">
                                    <th class="p-4">Mã NV</th>
                                    <th class="p-4">Họ Tên</th>
                                    <th class="p-4">Bộ Phận</th>
                                    <th class="p-4">Số Công (Ngày)</th>
                                    <th class="p-4 font-bold text-blue-600">Tổng Lương Dự Kiến (VNĐ)</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y text-sm">
                                ${db.staffs.map(s => {
                                    const daysWorked = db.attendance.filter(a => a.staffId === s.id && a.checkIn).length;
                                    const totalSalary = daysWorked * 300000; // Giả lập lương 300k/ngày công
                                    return `
                                        <tr>
                                            <td class="p-4 font-semibold">${s.id}</td>
                                            <td class="p-4">${s.name}</td>
                                            <td class="p-4">${s.role}</td>
                                            <td class="p-4 font-medium">${daysWorked} công</td>
                                            <td class="p-4 font-bold text-blue-600">${totalSalary.toLocaleString()} đ</td>
                                        </tr>
                                    `;
                                }).join('')}
                            </tbody>
                        </table>
                    </div>
                `;
            } else if (tabId === 'admin-cskh') {
                main.innerHTML = `
                    <h2 class="text-xl font-bold text-gray-800 mb-6">Trung Tâm Hỗ Trợ Nội Bộ / CSKH</h2>
                    <div class="space-y-4">
                        ${db.tickets.length === 0 ? `<p class="text-gray-400">Không có yêu cầu hỗ trợ nào.</p>` :
                        db.tickets.map(t => {
                            const st = db.staffs.find(s => s.id === t.staffId);
                            return `
                                <div class="bg-white p-5 rounded-xl shadow border">
                                    <div class="flex justify-between items-start mb-2">
                                        <div>
                                            <h3 class="font-bold text-gray-800">${t.title}</h3>
                                            <p class="text-xs text-gray-500">Gửi bởi: <span class="font-semibold text-blue-600">${st ? st.name : t.staffId}</span></p>
                                        </div>
                                        <span class="bg-yellow-50 text-yellow-700 px-2 py-1 rounded text-xs font-semibold">${t.status}</span>
                                    </div>
                                    <p class="text-sm text-gray-700 bg-gray-50 p-3 rounded-lg mb-3">${t.content}</p>
                                    <div class="flex space-x-2">
                                        <input type="text" id="reply-input-${t.id}" placeholder="Nhập câu trả lời phản hồi..." class="flex-1 border px-3 py-1.5 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                                        <button onclick="replyTicket(${t.id})" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-1.5 rounded-lg text-sm transition">Gửi phản hồi</button>
                                    </div>
                                </div>
                            `;
                        }).join('')}
                    </div>
                `;
            } 
            // --- GIAO DIỆN DÀNH CHO NHÂN VIÊN ---
            else if (tabId === 'staff-dashboard') {
                main.innerHTML = `
                    <div class="bg-gradient-to-r from-blue-600 to-indigo-600 rounded-2xl text-white p-8 mb-6 shadow-lg">
                        <h2 class="text-2xl font-bold mb-2">Xin chào, ${currentUser.name}!</h2>
                        <p class="text-blue-100 text-sm">Chào mừng bạn quay trở lại làm việc. Chúc bạn một ngày làm việc hiệu quả.</p>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                        <div class="bg-white p-6 rounded-xl shadow border">
                            <div class="flex items-center space-x-4">
                                <div class="bg-blue-50 text-blue-600 p-3 rounded-xl text-xl"><i class="fa-solid fa-id-badge"></i></div>
                                <div>
                                    <p class="text-xs text-gray-400 font-medium">Mã Nhân Viên</p>
                                    <p class="text-lg font-bold text-gray-800">${currentUser.id}</p>
                                </div>
                            </div>
                        </div>
                        <div class="bg-white p-6 rounded-xl shadow border">
                            <div class="flex items-center space-x-4">
                                <div class="bg-green-50 text-green-600 p-3 rounded-xl text-xl"><i class="fa-solid fa-briefcase"></i></div>
                                <div>
                                    <p class="text-xs text-gray-400 font-medium">Bộ Phận</p>
                                    <p class="text-lg font-bold text-gray-800">${currentUser.role}</p>
                                </div>
                            </div>
                        </div>
                        <div class="bg-white p-6 rounded-xl shadow border">
                            <div class="flex items-center space-x-4">
                                <div class="bg-purple-50 text-purple-600 p-3 rounded-xl text-xl"><i class="fa-solid fa-phone"></i></div>
                                <div>
                                    <p class="text-xs text-gray-400 font-medium">Số Điện Thoại</p>
                                    <p class="text-lg font-bold text-gray-800">${currentUser.phone}</p>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            } else if (tabId === 'staff-attendance') {
                const today = new Date().toISOString().split('T')[0];
                const myAttendance = db.attendance.find(a => a.staffId === currentUser.id && a.date === today);
                main.innerHTML = `
                    <h2 class="text-xl font-bold text-gray-800 mb-6">Chấm Công Trực Tuyến (${today})</h2>
                    <div class="bg-white p-8 rounded-xl shadow max-w-lg">
                        <div class="text-center mb-6">
                            <i class="fa-solid fa-fingerprint text-6xl text-blue-600 mb-3"></i>
                            <p class="text-gray-600 text-sm">Bấm nút bên dưới để thực hiện Check-in hoặc Check-out ca làm việc của bạn trong ngày.</p>
                        </div>
                        <div class="space-y-4">
                            <div class="flex justify-between items-center bg-gray-50 p-4 rounded-lg border">
                                <div>
                                    <p class="text-xs text-gray-500">Giờ vào đã ghi nhận:</p>
                                    <p class="text-lg font-bold text-green-600">${myAttendance && myAttendance.checkIn ? myAttendance.checkIn : 'Chưa Check-in'}</p>
                                </div>
                                <button onclick="doCheckIn()" class="bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded-lg text-sm font-medium transition">Check-in</button>
                            </div>
                            <div class="flex justify-between items-center bg-gray-50 p-4 rounded-lg border">
                                <div>
                                    <p class="text-xs text-gray-500">Giờ ra đã ghi nhận:</p>
                                    <p class="text-lg font-bold text-red-600">${myAttendance && myAttendance.checkOut ? myAttendance.checkOut : 'Chưa Check-out'}</p>
                                </div>
                                <button onclick="doCheckOut()" class="bg-red-600 hover:bg-red-700 text-white px-4 py-2 rounded-lg text-sm font-medium transition">Check-out</button>
                            </div>
                        </div>
                    </div>
                `;
            } else if (tabId === 'staff-shifts') {
                const myShifts = db.shifts.filter(s => s.staffId === currentUser.id);
                main.innerHTML = `
                    <h2 class="text-xl font-bold text-gray-800 mb-6">Lịch Trực Ca Của Tôi</h2>
                    <div class="bg-white rounded-xl shadow overflow-hidden">
                        <table class="w-full text-left border-collapse">
                            <thead>
                                <tr class="bg-gray-50 border-b text-gray-600 text-sm">
                                    <th class="p-4">Ngày Trực</th>
                                    <th class="p-4">Tên Ca Làm Việc</th>
                                    <th class="p-4">Trạng thái</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y text-sm">
                                ${myShifts.length === 0 ? `<tr><td colspan="3" class="p-6 text-center text-gray-400">Bạn chưa được phân công ca trực nào.</td></tr>` :
                                myShifts.map(sh => `
                                    <tr>
                                        <td class="p-4 font-semibold">${sh.date}</td>
                                        <td class="p-4">${sh.name}</td>
                                        <td class="p-4"><span class="bg-blue-50 text-blue-700 px-2 py-1 rounded text-xs font-semibold">Đã lên lịch</span></td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    </div>
                `;
            } else if (tabId === 'staff-cskh') {
                const myTickets = db.tickets.filter(t => t.staffId === currentUser.id);
                main.innerHTML = `
                    <h2 class="text-xl font-bold text-gray-800 mb-6">Hệ Thống Hỗ Trợ / CSKH Nội Bộ</h2>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div class="bg-white p-6 rounded-xl shadow border">
                            <h3 class="font-bold text-gray-800 mb-4">Gửi Yêu Cầu / Báo Cáo Mới</h3>
                            <form onsubmit="submitTicket(event)" class="space-y-4">
                                <div>
                                    <label class="block text-sm font-medium text-gray-700 mb-1">Tiêu đề yêu cầu</label>
                                    <input type="text" id="ticket-title" required placeholder="Ví dụ: Sai sót bảng lương..." class="w-full px-3 py-2 border rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                                </div>
                                <div>
                                    <label class="block text-sm font-medium text-gray-700 mb-1">Nội dung chi tiết</label>
                                    <textarea id="ticket-content" required rows="4" placeholder="Mô tả chi tiết vấn đề cần hỗ trợ..." class="w-full px-3 py-2 border rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"></textarea>
                                </div>
                                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 rounded-lg text-sm transition">Gửi Yêu Cầu</button>
                            </form>
                        </div>
                        <div class="space-y-4">
                            <h3 class="font-bold text-gray-800 mb-2">Lịch Sử Yêu Cầu Đã Gửi</h3>
                            ${myTickets.length === 0 ? `<p class="text-gray-400 text-sm">Chưa có yêu cầu hỗ trợ nào được gửi.</p>` :
                            myTickets.map(t => `
                                <div class="bg-white p-4 rounded-xl shadow border">
                                    <div class="flex justify-between items-start mb-1">
                                        <h4 class="font-bold text-gray-800 text-sm">${t.title}</h4>
                                        <span class="bg-blue-50 text-blue-700 px-2 py-0.5 rounded text-xs font-semibold">${t.status}</span>
                                    </div>
                                    <p class="text-xs text-gray-600 mb-2">${t.content}</p>
                                    ${t.reply ? `<div class="bg-green-50 border border-green-200 p-2.5 rounded-lg text-xs text-green-800 mt-2"><strong>Phản hồi từ Admin:</strong> ${t.reply}</div>` : `<p class="text-xs text-gray-400 italic">Đang chờ phản hồi...</p>`}
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            }
        }

        // --- 4. CÁC HÀM XỬ LÝ NGHIỆP VỤ ---
        function openAddStaffModal() {
            const name = prompt('Nhập họ tên nhân viên mới:');
            if (!name) return;
            const role = prompt('Nhập bộ phận (Ví dụ: Nhân sự, CSKH, Kỹ thuật):', 'CSKH');
            const phone = prompt('Nhập số điện thoại:', '0900000000');
            const id = 'NV0' + (getDB().staffs.length + 1);

            const db = getDB();
            db.staffs.push({ id, name, role, phone, pass: '123' });
            saveDB(db);
            switchTab('admin-staff');
            renderStaffDropdown();
        }

        function deleteStaff(id) {
            if (!confirm('Bạn có chắc chắn muốn xóa nhân viên này?')) return;
            const db = getDB();
            db.staffs = db.staffs.filter(s => s.id !== id);
            saveDB(db);
            switchTab('admin-staff');
            renderStaffDropdown();
        }

        function openAddShiftModal() {
            const db = getDB();
            const staffId = prompt('Nhập mã nhân viên phụ trách ca trực (Ví dụ: NV01):', 'NV01');
            const name = prompt('Nhập tên ca trực:', 'Ca Sáng (08:00 - 12:00)');
            const date = prompt('Nhập ngày trực (YYYY-MM-DD):', new Date().toISOString().split('T')[0]);
            
            if (!staffId || !name || !date) return;
            db.shifts.push({ id: Date.now(), staffId, name, date });
            saveDB(db);
            switchTab('admin-shifts');
        }

        function deleteShift(id) {
            const db = getDB();
            db.shifts = db.shifts.filter(s => s.id !== id);
            saveDB(db);
            switchTab(currentUser.type === 'admin' ? 'admin-shifts' : 'staff-shifts');
        }

        function doCheckIn() {
            const db = getDB();
            const today = new Date().toISOString().split('T')[0];
            const timeNow = new Date().toLocaleTimeString();
            
            let record = db.attendance.find(a => a.staffId === currentUser.id && a.date === today);
            if (record) {
                if (record.checkIn) {
                    alert('Bạn đã thực hiện Check-in hôm nay rồi!');
                    return;
                }
                record.checkIn = timeNow;
            } else {
                db.attendance.push({ staffId: currentUser.id, date: today, checkIn: timeNow, checkOut: null });
            }
            saveDB(db);
            switchTab('staff-attendance');
            alert('Check-in thành công lúc ' + timeNow);
        }

        function doCheckOut() {
            const db = getDB();
            const today = new Date().toISOString().split('T')[0];
            const timeNow = new Date().toLocaleTimeString();
            
            let record = db.attendance.find(a => a.staffId === currentUser.id && a.date === today);
            if (!record || !record.checkIn) {
                alert('Bạn chưa thực hiện Check-in hôm nay!');
                return;
            }
            record.checkOut = timeNow;
            saveDB(db);
            switchTab('staff-attendance');
            alert('Check-out thành công lúc ' + timeNow);
        }

        function submitTicket(e) {
            e.preventDefault();
            const title = document.getElementById('ticket-title').value;
            const content = document.getElementById('ticket-content').value;

            const db = getDB();
            db.tickets.push({ id: Date.now(), staffId: currentUser.id, title, content, status: 'Đang xử lý', reply: '' });
            saveDB(db);
            switchTab('staff-cskh');
            alert('Đã gửi yêu cầu hỗ trợ thành công!');
        }

        function replyTicket(id) {
            const replyText = document.getElementById(`reply-input-${id}`).value;
            if (!replyText) return alert('Vui lòng nhập nội dung phản hồi!');

            const db = getDB();
            const ticket = db.tickets.find(t => t.id === id);
            if (ticket) {
                ticket.reply = replyText;
                ticket.status = 'Đã xử lý';
                saveDB(db);
                switchTab('admin-cskh');
                alert('Đã gửi phản hồi thành công!');
            }
        }
    </script>
</body>
</html>
